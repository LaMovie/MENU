* {
   margin: 0;
   padding: 0;

}
body {
   background: #000;
   font-family: sans-serif;
   color: #fff;
   padding: 15px;
   min-height: 100vh;
   animation: puff-in-hor 1s cubic-bezier(.47,0,.745,.715) both;
}
.All {
   display: flex;
   flex-direction: column;
   gap: 20px;
   max-width: 1400px;
   margin: 0 auto;
}
.player-section {
   width: 100%;
   display: flex;
   flex-direction: column;
   gap: 10px;
}
#Vid {
    width: 100%;
    aspect-ratio: 16 / 9;
    height: auto;
    border-radius: 10px;
    background: #000;
    border: none;
}
#FF {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 10px;
}
#MG {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    object-fit: cover;
    opacity: .8;
}
#H {
    color: #4f9;
    opacity: .7;
    font-weight: bold;
    font-size: .8rem;
    text-align: center;
    flex-grow: 1;
}
#FULL {     
    width: 20%;
    color: #000;   
    opacity: 0.5;
    padding: 1px;
    font-size: 10px; 
    background: gray;
    font-weight: bold;       
    border-radius: 50px;
    border: none;
    transition: 0.3s;
}
#FULL:hover {
    color: #fff;
    background: blue;
}
.contenedor {
    width: 100%;
}
#Grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 10px;
    max-height: 50vh;
    overflow-y: auto;
    padding: 5px;
}
#Grid img {
    width: 100%;
    height: 75px;
    object-fit: contain;
    background: transparent;
    border-radius: 20px;
    transition: transform 0.5s ease, border 0.3s ease, box-shadow 0.3s ease;
}
#Grid img:hover {    
    transform: scale(1.1);
    box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
    border: 2px solid blue;  
}
  

/* --- VISTA ADAPTADA PARA PC --- */

@media screen and (min-width: 850px) {
   .All {
        flex-direction: row;
        align-items: flex-start;
  }
   .player-section {
        flex: 65%;
  }
   .contenedor {
        flex: 35%;
  }

   #Grid {
         grid-template-columns: repeat(3, 1fr);
          max-height: 85vh;
  }
}

@keyframes puff-in-hor {
      0% { transform: scaleX(2); filter: blur(4px); opacity: 0; }
     100% { transform: scaleX(1); filter: blur(0px); opacity: 1; }
}

@media (min-width: 500px) {
    #Grid img {
       border-radius: 50%;
    }
    #FULL {
        width: 20vh;
    }
    #Grid::-webkit-scrollbar {
    width: 6px;
  }
    #Grid::-webkit-scrollbar-thumb {
    background: #aaa; 
    border-radius: 10px;
  }
    #Grid::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
  }
}
</style>

<script>
    var FULL = document.getElementById('FULL');
    var iframe = document.getElementById('Vid');

    FULL.onclick = () => {
        if (iframe.requestFullscreen) {
            iframe.requestFullscreen();
        } else if (iframe.mozRequestFullScreen) {
            iframe.mozRequestFullScreen();
        } else if (iframe.webkitRequestFullscreen) {
            iframe.webkitRequestFullscreen();
        } else if (iframe.msRequestFullscreen) {
            iframe.msRequestFullscreen();
        }
    };

    document.addEventListener('fullscreenchange', function() {
        if (document.fullscreenElement) {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(()=>{});
            }
        } else {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('portrait').catch(()=>{});
            }
        }
    });
</script>
