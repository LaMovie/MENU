<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>AIDA 📺</title>
   <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet"/>
<style>
body {
    background: #000;
}
#Container {
    width: 100%;
    display: flex;
    place-items: center;
    flex-direction: column;
}
#V {
    width: 90%;
    height: 35vh;
    aspect-ratio: 16/9;
    border-radius: 5%;
    border-top: .5vh solid brown;
    border-left: 2vh solid brown;
    border-right: .1vh solid brown;
    border-bottom: 2vh solid #800000;
}
#V:fullscreen,
#V:-webkit-full-screen {
    border-color: #000;
    border-radius: 0;
}
#FULL {
    width: 15vh;
    opacity: 0.5;
    padding: 1px;
    color: black;
    font-size: 15px;
    background: gray;    
    font-weight: bold;    
    border-radius: 50px;    
}
.Opaco {
    opacity: .5;    
    color: #ccc;
    opacity: 0.3;
    margin-top: 7vh;
    font-size: 35px;
    font-family: Luckiest Guy, cursive;
    -webkit-text-stroke: .1px #003;
    text-shadow: 0px .1px 0 #001;
}
#T {
    color: gold;
    font-family: Luckiest Guy, cursive;
    -webkit-text-stroke: .1px #003;
    text-shadow: 0px .1px 0 #001;
}
#H {
    color: gold;
    font-family: serif;
}

@media (min-width: 500px) {
    #V {
        width: 80%;
        max-width: 850px; /* Esto evita que se vea gigante en PC */
        height: 75vh;
    }    
    #FULL {
        width: 25vh;
    }
}
</style>
</head>
<body>        
      <div id="Container">   
     
  <h1 id="T">👄 AIDA-TV 👅</h1><br/>
     
    <video poster="IMG/imagen_12.jpg" id="V" src="" autoplay controls></video>
             
   <h3 id="H">📺 AIDA-TV 📺</h3>             
  
  <button id="FULL">Pantalla Completa</button>
       
       <pre class="Opaco">
    °LA MOVIE
   PROPERTY°
         </pre>
            </div>
<script>

     V.src = MIX;
        
    // Buscamos un patrón del tipo "número x número" (ej: 3x01, 4x12, 5x03) en el enlace.
    
        var match = MIX.match(/(\d+x\d+)/i);
        if (match) {
            // Si lo encuentra, extrae el texto (ej: "3x01") y lo formatea ordenadamente en el H3.
            
 var cap = match[1].toLowerCase();
   
 H.innerText = "📺 " + cap + " 📺";
        }
    }; 
</script>

<script>
    var Button = document.querySelector('#FULL');
   var iframe = document.querySelector('#V');

   Button.addEventListener('click', function() {
  if (iframe.requestFullscreen) {
    iframe.requestFullscreen();
  } else if (iframe.mozRequestFullScreen) { // Firefox
    iframe.mozRequestFullScreen();
  } else if (iframe.webkitRequestFullscreen) { // Chrome, Safari and Opera
    iframe.webkitRequestFullscreen();
  } else if (iframe.msRequestFullscreen) { // IE/Edge
    iframe.msRequestFullscreen();
  }
});
</script>

</html>
